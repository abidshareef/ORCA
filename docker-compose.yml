version: '3.8'
services:
  db:
    image: postgis/postgis:15-3.3
    container_name: orca-db
    environment:
      - POSTGRES_USER=orca_user
      - POSTGRES_PASSWORD=orca_password
      - POSTGRES_DB=orca_ecosystem
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
