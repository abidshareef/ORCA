services:
  - type: web
    name: orca-api
    runtime: python
    plan: free
    buildCommand: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/ready
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ORCA_DATA_MODE
        value: demo
      # This is a public demo API without cookie/session auth. Restrict this to the
      # exact frontend origin before adding authenticated or user-specific data.
      - key: CORS_ORIGINS
        value: "*"
      - key: LOG_LEVEL
        value: INFO
